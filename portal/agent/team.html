<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team — TwelvePoint Agent Portal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Libre+Franklin:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/portal.css">
<link rel="stylesheet" href="/assets/agent-dashboard.css?v=8">
</head>

<!-- ==========================================================================
     AGENT — TEAM (admin only)

     The list comes from a SECURITY DEFINER function, because auth.users is
     not reachable through the Data API. That function checks is_admin()
     before returning a single row — the check is the whole security model
     here, not the fact that this page is hard to find.
     ========================================================================== -->

<body class="portalbody agentui">
<a class="skip" href="#main">Skip to content</a>

<div class="app" data-portal-page>

  <nav class="rail" aria-label="Portal">
    <a class="rail__brand" href="/index.html" aria-label="TwelvePoint Realty Group — home">
      <img src="/assets/mark-cream.png" width="648" height="112" alt="TwelvePoint Realty Group">
    </a>
    <div class="rail__nav">
      <a data-icon="transactions" href="/portal/agent/">Transactions</a>
      <a data-icon="contracts" href="/portal/agent/contracts.html">Contracts</a>
      <a data-icon="marketing" href="/portal/agent/marketing.html">Marketing</a>
      <a data-icon="vendors" href="/portal/agent/vendors.html">Vendor List</a>
      <a data-icon="team" href="/portal/agent/team.html" data-admin-only hidden aria-current="page">Team</a>
      <a data-icon="leads" href="/portal/agent/leads.html" data-staff-only hidden>Leads</a>
    </div>
    <div class="rail__foot">
      <span class="rail__who">
        <span class="rail__role" data-portal-rolelabel>Agent</span>
        <span class="rail__name" data-portal-name></span>
      </span>
      <button class="rail__out" type="button" data-portal-logout>Log Out</button>
    </div>
  </nav>

  <main class="appmain" id="main">
    <div class="panel">
      <h1 class="panel__title">Team</h1>
      <p class="panel__count">Everyone with an account</p>

      <div data-team-list>
        <p class="skeleton">Loading…</p>
      </div>

      <p class="note mt-l">
        A role change takes effect the next time that person signs in &mdash; it
        travels inside their session token, so an open session keeps the old
        one until it refreshes.
      </p>

      <!-- Agents and admins both. The client is named by email rather than
           chosen from a list: a dropdown would mean letting every agent read
           every profile in the brokerage, which is a bigger door than this
           needs. The database function looks up that one address and refuses
           if the caller is not staff. -->
    </div>
  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/assets/supabase-config.js"></script>
<!-- agent.js BEFORE portal.js, and the order is load-bearing.
     portal.js dispatches inside sb.auth.getSession().then(). That resolves
     from localStorage with no network call, so the callback runs as a
     microtask at the end of portal.js own execution — before a later
     <script> has been executed. window.AG would not exist yet and the
     dashboard would never start, silently. -->
<script src="/assets/agent.js?v=8"></script>
<script src="/assets/portal.js?v=8"></script>
</body>
</html>
