<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transaction — TwelvePoint Realty Group</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Libre+Franklin:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/portal.css">
<link rel="stylesheet" href="/assets/portal-rail.css?v=12">
</head>

<!-- ==========================================================================
     TRANSACTION DETAIL — Overview / Contacts / Documents / Messages.

     The transaction id arrives as ?id= in the URL. That is NOT a security
     hole and must not be "fixed" by hiding it: every query for this page
     is filtered by RLS, so pasting someone else's id returns nothing at
     all. The id in the URL selects; the database authorises.
     ========================================================================== -->

<body class="portalbody">
<a class="skip" href="#main">Skip to content</a>

<div class="app" data-portal-page data-portal-detail>

  <nav class="rail" aria-label="Portal">
    <a class="rail__brand" href="/index.html" aria-label="TwelvePoint Realty Group — home">
      <img src="/assets/mark-cream.png" width="648" height="112" alt="TwelvePoint Realty Group">
    </a>
    <div class="rail__nav">
      <a data-icon="transactions" href="/portal/client/" aria-current="page">My Transactions</a>
      <a data-icon="contact" href="/index.html#contact">Contact Us</a>
    </div>
    <div class="rail__foot">
      <span class="rail__who">
        <span class="rail__role">Client</span>
        <span class="rail__name" data-portal-name></span>
      </span>
      <button class="rail__out" type="button" data-portal-logout>Log Out</button>
    </div>
  </nav>

  <main class="appmain" id="main">
    <div class="panel">

      <a class="dtl__back" href="/portal/client/">&larr; All transactions</a>
      <h1 class="dtl__addr" data-dtl-addr>Loading…</h1>

      <p class="note note--err" data-dtl-error hidden></p>

      <div data-dtl-body hidden>
        <div class="tabs" role="tablist" aria-label="Transaction sections">
          <button class="tabs__tab" role="tab" id="tab-overview"  aria-selected="true"  aria-controls="panel-overview">Overview</button>
          <button class="tabs__tab" role="tab" id="tab-contacts"  aria-selected="false" aria-controls="panel-contacts"  tabindex="-1">Contacts</button>
          <button class="tabs__tab" role="tab" id="tab-documents" aria-selected="false" aria-controls="panel-documents" tabindex="-1">Documents</button>
          <button class="tabs__tab" role="tab" id="tab-messages"  aria-selected="false" aria-controls="panel-messages"  tabindex="-1">Messages</button>
        </div>

        <!-- ---------------------------------------------- overview ---- -->
        <section class="tabpanel" role="tabpanel" id="panel-overview" aria-labelledby="tab-overview" tabindex="0">
          <p class="prog__status">Current status<b data-dtl-status>—</b></p>

          <ol class="prog" data-dtl-progress>
            <li class="prog__step"><span class="prog__n">1</span><span class="prog__label">Under contract</span></li>
            <li class="prog__step"><span class="prog__n">2</span><span class="prog__label">Option &amp; inspection</span></li>
            <li class="prog__step"><span class="prog__n">3</span><span class="prog__label">Ready for closing</span></li>
            <li class="prog__step"><span class="prog__n">4</span><span class="prog__label">Closed</span></li>
          </ol>

          <div class="actions" data-dtl-actions hidden>
            <h3>To keep things moving</h3>
            <ul data-dtl-actionlist></ul>
          </div>

        </section>

        <!-- ---------------------------------------------- contacts ---- -->
        <section class="tabpanel" role="tabpanel" id="panel-contacts" aria-labelledby="tab-contacts" tabindex="0" hidden>
          <div class="contacts" data-dtl-contacts></div>
        </section>

        <!-- ---------------------------------------------- documents --- -->
        <section class="tabpanel" role="tabpanel" id="panel-documents" aria-labelledby="tab-documents" tabindex="0" hidden>
          <div data-dtl-documents></div>
        </section>

        <!-- ---------------------------------------------- messages ---- -->
        <section class="tabpanel" role="tabpanel" id="panel-messages" aria-labelledby="tab-messages" tabindex="0" hidden>
          <div class="msgs" data-dtl-messages></div>

          <form class="msgform" data-msg-form>
            <label class="sr-only" for="msg-body">Write a message</label>
            <textarea id="msg-body" name="body" maxlength="5000"
                      placeholder="Ask a question, or tell us something we should know."></textarea>
            <p class="note" data-msg-status hidden></p>
            <div class="msgform__actions">
              <button class="btn" type="submit">Send message <span class="btn__arrow" aria-hidden="true">&rarr;</span></button>
            </div>
          </form>
        </section>
      </div>

    </div>
  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/assets/supabase-config.js"></script>
<script src="/assets/rail.js?v=12"></script>
<script src="/assets/portal.js"></script>
</body>
</html>
